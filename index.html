<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vocabWeb | 英文單字學習網站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&amp;family=Noto+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header>
        <h1>Vocabry</h1>
        <p class="slogan">Expand your vocabulary. Expand your world.</p>
        <nav class="tab">
            <button class="tab-btn tab-btn-active" data-tab="card">單字卡</button>
            <button class="tab-btn" data-tab="quiz">測驗</button>
            <button class="tab-btn" data-tab="progress">進度</button>
        </nav>
    </header>
    <main>
        <section class="page active" id="card">
            <div class="flashcard" id="flashcard"> 
                <div class="card-inner">
                    <div class="card-face card-front">
                        <p class="en" id="cardWord">載入中...</p>
                        <p class="hint">點一下卡片翻面</p>
                    </div>
                    <div class="card-face card-back">
                        <p class="zh" id="cardMeaning"></p>
                        <p class="example" id="cardExample">,</p>
                    </div>
                </div>
            </div>
            <p class="counter" id="cardCounter"></p>
            <div class="ctrl">
                <button id="prevBtn" class="ctrlBtn"><i class="fa-solid fa-arrow-left"></i>上一張</button>
                <button id="shuffleBtn" class="ctrlBtn"><i class="fa-solid fa-shuffle"></i>洗牌</button>
                <button id="nextBtn" class="ctrlBtn">下一張<i class="fa-solid fa-arrow-right"></i></button>  
            </div>

            <div class="learn">
                <button id="learnBtn" class="learn-btn">我學會了!</button>
                <button id="reviewModeBtn" class="learn-btn"><i class="fa-solid fa-repeat"></i> 只看還沒學會的:關</button> 
            </div>
            

        </section>
        
        <section class="page" id="quiz">
            
            <div id="quizStart" class="quiz-start">
                <select id="modeSelect" class="mode-select">
                    <option value="enToZh" class="mode">英翻中</option>
                    <option value="zhToEn" class="mode">中翻英</option>
                    <option value="random" class="mode">隨機</option>
                </select>

                <p class="quiz-intro">每輪10題, 選出正確的意思</p>
                <button id="startQuizBtn" class="big-btn">開始測驗</button>
            </div>

            <div class="hidden" id="quizMain">
                <p id="quizInfo" class="quiz-info"></p>
                <p id="question" class="question"></p>

                <div id="options"></div>
                <button id="nextQBtn" class="big-btn hidden">下一題<i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="hidden" id="quizEnd">
                <h2>測驗結束!</h2>
                <p id="finalScore" class="final-score"></p>
                <p id="finalMsg"></p>
                <button id="restartBtn" class="big-btn">再玩一次</button>
            </div>

        </section>

        <section class="page" id="progress">
            <h2 class="progress-title">我的學習進度</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText"></p>
            <h3 class="list-title">已學會的單字</h3>
            <ul class="learned-list" id="learnedList"></ul> 
            <button class="reset-btn" id="resetBtn">清除所有紀錄</button>
        </section>

    </main>

    <footer class="end">© 2026 劉子翊</footer>

    <script src="words.js"></script>
    <script src="app.js"></script>
    <script src="quiz.js"></script>
    <script src="process.js"></script>

</body>
</body>
</html>
